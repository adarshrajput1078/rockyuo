<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Channel Entry</title>

    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '968357979280809');
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=968357979280809&ev=PageView&noscript=1"
    /></noscript>
    <style>
        /* Premium Dark Gradient Background */
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        
        /* Logo Styling */
        .brand-logo {
            width: 150px;
            height: 150px;
            border-radius: 20px; /* Thoda square look */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 25px;
            border: 2px solid #ffaa00; /* Gold border */
        }

        h1 {
            font-size: 28px;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ffaa00; /* Gold text */
        }

        /* Timer Box */
        .timer-container {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 35px;
            border-radius: 12px;
            margin-bottom: 35px;
            border: 1px dashed #ffaa00;
        }

        .timer-text {
            font-size: 16px;
            color: #cccccc;
        }

        /* Countdown Number */
        .countdown {
            font-size: 50px;
            font-weight: 900;
            color: #00e676; /* Neon Green */
            display: block;
            margin-top: 5px;
            text-shadow: 0 0 15px rgba(0, 230, 118, 0.5);
        }

        /* Button Styling */
        .join-button {
            background: #0088cc;
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: 900;
            padding: 18px 50px;
            border-radius: 50px;
            width: 100%;
            max-width: 320px;
            border: 2px solid #ffffff;
            box-shadow: 0 8px 25px rgba(0, 136, 204, 0.6);
            cursor: pointer;
            animation: pop 1s infinite alternate; /* Button Hilne ki animation */
        }

        @keyframes pop {
            0% { transform: scale(1); }
            100% { transform: scale(1.06); }
        }

        .join-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="VIP Channel" class="brand-logo">

    <h1>Free VIP Entry</h1>

    <div class="timer-container">
        <div class="timer-text">Redirecting to Telegram in...</div>
        <span class="countdown" id="timer">03</span>
    </div>

    <a class="join-button" onclick="fireLeadAndRedirect(event)">JOIN NOW</a>

    <script>
        // 👇 YAHAN APNA NAYA TELEGRAM LINK DAALO 👇
        const TELEGRAM_URL = "https://t.me/+liWoaEamVuhlNDY1"; 

        let timeLeft = 3; 
        const timerElement = document.getElementById('timer');

        // Pixel Fire aur Redirect function
        function fireLeadAndRedirect(e) {
            if(e) e.preventDefault(); 
            
            // Facebook ko 'Lead' event bhejna
            if (typeof fbq !== 'undefined') {
                fbq('track', 'Lead'); 
            }
            
            // 500ms delay taaki Pixel ko data submit karne ka time mil jaye
            setTimeout(() => {
                window.location.href = TELEGRAM_URL;
            }, 500);
        }

        // Auto Timer Logic
        const countdownInterval = setInterval(() => {
            timeLeft--;
            timerElement.textContent = "0" + timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                fireLeadAndRedirect(); 
            }
        }, 1000);
    </script>

</body>
</html>
